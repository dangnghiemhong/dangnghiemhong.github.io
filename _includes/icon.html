{%- comment -%}
  Inline SVG icon from the sprite in assets/img/icons.svg.
  Usage: {% include icon.html name="github" %}   (optional: class="my-class")
{%- endcomment -%}
<svg class="icon{% if include.class %} {{ include.class }}{% endif %}" aria-hidden="true" focusable="false"><use href="{{ '/assets/img/icons.svg' | relative_url }}#i-{{ include.name }}"></use></svg>
