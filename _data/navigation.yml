# Main navigation, in display order.
# `requires` hides an item until its content exists, so the menu never links to an empty page.
#   requires: publications  → shown once _data/publications.yml has entries
#   requires: projects      → shown once _projects/ has entries
#   requires: posts         → shown once _posts/ has entries
# To add a page, create it with `permalink:` and add a line here.
- title: Publications
  url: /publications/
  requires: publications
- title: Projects
  url: /projects/
  requires: projects
- title: Blog
  url: /blog/
  requires: posts
- title: CV
  url: /cv/
