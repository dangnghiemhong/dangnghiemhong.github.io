<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <div class="header">
            <a href="{{ '/' | relative_url }}">
                <img src="{{ '/pic.jpg' | relative_url }}" alt="Profile picture of {{ site.author }}" class="profile-pic">
            </a>
            <h1>{{ site.title }}</h1>
            <p>{{ site.description }}</p>
        </div>

        <!-- Tab Navigation -->
        <nav class="tab-navigation">
            <ul class="tab-buttons">
                <li><a href="{{ '/' | relative_url }}" class="tab-link {% if page.url == '/' %}active{% endif %}">Home</a></li>
                <li><a href="{{ '/writing/' | relative_url }}" class="tab-link {% if page.url contains '/writing' %}active{% endif %}">Writing</a></li>
                <li><a href="{{ '/knowledge/' | relative_url }}" class="tab-link {% if page.url contains '/knowledge' %}active{% endif %}">Knowledge</a></li>
                <li><a href="{{ '/blog/' | relative_url }}" class="tab-link {% if page.url contains '/blog' %}active{% endif %}">Blog</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="tab-content">
            <div class="tab-pane active">
                {{ content }}
            </div>
        </div>
    </div>
</body>
</html>
