# Small line above your name on the home page.
eyebrow: "MSc student · Data & AI · IP Paris"

# Short bio shown in the hero. Markdown is allowed (links, **bold**).
bio: >-
  I'm a Master's student in Data & Artificial Intelligence at
  [Institut Polytechnique de Paris](https://www.ip-paris.fr/en).
  My research interests are deep learning, computational modeling, and creating
  data-driven digital twins of human health by integrating clinical data with
  physics-based simulations.

# Research interests: shown as cards on the home page. Add, remove or reword freely.
interests:
  - title: Deep learning
    text: Learning-based models for complex, high-dimensional data.
  - title: Computational modeling
    text: Mathematical and numerical models of complex systems.
  - title: Digital twins for human health
    text: Data-driven, patient-specific models of the human body.
  - title: Clinical data × physics-based simulation
    text: Combining patient measurements with mechanistic simulation.

