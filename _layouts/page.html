---
layout: default
---
<div class="wrap page">
  <header class="page-head">
    <h1 class="page-title">{{ page.title }}</h1>
    {%- if page.subtitle %}
    <p class="page-sub">{{ page.subtitle }}</p>
    {%- endif %}
  </header>
  <div{% if page.prose %} class="prose"{% endif %}>
    {{ content }}
  </div>
</div>
