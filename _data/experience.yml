- organization: PASSIO Lab
  detail: North Carolina A&T State University & Harvard Medical School (BIDMC)
  role: Research Assistant
  period: Aug 2025 – Sep 2026
  location: Remote
  description: Research assistant on [The Living Heart Project](https://www.3ds.com/heart).
  details:
    - "Adapted an ECG foundation model to echo-confirmed disease screening on 100,000 ECG–echocardiogram pairs (EchoNext): continued self-supervised pretraining plus layer-wise partial fine-tuning reached 0.851 macro-AUROC / 0.426 AUPRC over 6 labels, beating XGBoost (0.802), ResNet1D (0.825), frozen-encoder transfer (0.823) and LoRA (0.820), and beating full fine-tuning on F1 (0.369 vs 0.342) while updating only 41.5M parameters."
    - "Showed unified multi-label training beats 6 task-specific binary models (F1 0.369 vs 0.277) and that downsampling all-negative training records lifts F1 to 0.410, a simple operating-point knob for compute-aware clinical triage."
    - "Designed an LLM-agent orchestrator that plans validation and uncertainty-quantification strategy from simulation state (multi-step planning, tool use); cut validation compute 40% and emitted SHAP-interpretable reports for clinical review."
    - "Reconstructed left-ventricular pressure–volume loops noninvasively from echocardiography: a physics-informed self-supervised pipeline coupling Windkessel constraints with Dassault Systèmes' SIMULIA Living Heart simulations, plus a high-fidelity mitral valve model, validated with Harvard Medical School cardiac surgeons."

